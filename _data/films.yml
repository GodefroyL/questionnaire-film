- id: fantomas
  nom: Fantomas
  titre: "Quiz Fantomas : testez vos connaissances sur le film culte de 1964"
  description: "Plongez dans l'univers du célèbre criminel masqué avec notre quiz sur Fantomas (1964). Découvrez si vous connaissez tous les détails de ce film culte d'André Hunebelle, avec Jean Marais dans le rôle du héros et du méchant. Testez vos connaissances sur les intrigues, les personnages emblématiques comme le commissaire Juve, et les scènes mémorables de ce classique du cinéma français."
  synopsis: "Fantomas est un film franco-italien réalisé par André Hunebelle, sorti en 1964. Ce film policer adaptée de la série de romans de Pierre Souvestre et Marcel Allain met en scène Jean Marais dans un double rôle : celui du criminel Fantomas et celui du journaliste Fandor. Le commissaire Juve, interprété par Louis de Funès, tente de démasquer le malfaiteur qui multiplie les méfaits à Paris. Avec des cascades spectaculaires, des décors impressionnants et une intrigue captivante, Fantomas est devenu un classique du cinéma d'aventure français. Le film a connu un tel succès qu'il a donné naissance à deux suites : Fantomas se déchaine (1965) et Fantomas contre Scotland Yard (1967)."
  image: "/static/images/films/fantomas.jpeg"
  image_alt: "Affiche du film Fantomas avec Jean Marais"
  annee: 1964
  realisateur: "André Hunebelle"
  acteurs: "Jean Marais, Louis de Funès, Mylène Demongeot"
  niveaux: 2

- id: fantomas-se-dechaine
  nom: "Fantomas se déchaine"
  titre: "Quiz Fantomas se déchaine : testez vos connaissances sur la suite de 1965"
  description: "Testez vos connaissances sur la suite des aventures de Fantomas avec notre quiz sur Fantomas se déchaine (1965). Découvrez si vous maîtrisez tous les détails de ce second volet, aussi palpitant que le premier, avec Jean Marais et Louis de Funès."
  synopsis: "Fantomas se déchaine est le deuxième volet de la trilogie Fantomas, réalisé par André Hunebelle et sorti en 1965. Dans cette suite, le criminel Fantomas, toujours interprété par Jean Marais, continue de semer la terreur à Paris. Le commissaire Juve (Louis de Funès) et le journaliste Fandor (également Jean Marais) unissent leurs forces pour tenter de mettre fin à ses agissements. Le film propose des scènes d'action encore plus spectaculaires, des rebondissements imprévisibles et une tension constante. Comme le premier volet, ce film a été tourné avec un budget important et des moyens techniques impressionnants pour l'époque."
  image: "/static/images/films/fantomas-se-dechaine.jpeg"
  image_alt: "Affiche du film Fantomas se déchaine"
  annee: 1965
  realisateur: "André Hunebelle"
  acteurs: "Jean Marais, Louis de Funès, Mylène Demongeot"
  niveaux: 2

- id: 7e-compagnie-1
  nom: "Mais où est donc passée la 7ème compagnie ?"
  titre: "Quiz La 7ème compagnie : testez vos connaissances sur la comédie militaire culte"
  description: "Revivez les aventures hilarantes de la 7ème compagnie avec notre quiz. Testez vos connaissances sur ce film culte de Robert Lamoureux, qui a marqué toute une génération avec ses scènes comiques et ses personnages inoubliables."
  synopsis: "Mais où est donc passée la 7ème compagnie ? est une comédie de guerre française réalisée par Robert Lamoureux, sortie en 1973. Le film raconte les péripéties d'une section de soldats français pendant la Seconde Guerre mondiale, en 1940. Les soldats, séparés de leur compagnie lors d'une retraite chaotique, tentent de rejoindre leurs lignes en traversant la France occupée. Avec un humour typiquement français et des situations absurdes, le film dépeint avec tendresse et ironie la débrouillardise des soldats face à l'adversité. Le succès du film a été tel qu'il a donné naissance à deux suites : On a retrouvé la 7ème compagnie (1975) et La 7ème compagnie au clair de lune (1977)."
  image: "/static/images/films/7e-compagnie-1.jpeg"
  image_alt: "Affiche du film Mais où est donc passée la 7ème compagnie ?"
  annee: 1973
  realisateur: "Robert Lamoureux"
  acteurs: "Jean Lefebvre, Pierre Mondy, Henri Guybet, Robert Lamoureux"
  niveaux: 2

- id: la-grande-vadrouille
  nom: "La grande vadrouille"
  titre: "Quiz La Grande Vadrouille : testez vos connaissances sur la comédie la plus vue de l'histoire du cinéma français"
  description: "Découvrez notre quiz sur La Grande Vadrouille, le film le plus populaire du cinéma français. Testez vos connaissances sur cette comédie culte de Gérard Oury avec Bourvil et Louis de Funès, qui continue de faire rire des générations entières."
  synopsis: "La Grande Vadrouille est un film franco-britannique réalisé par Gérard Oury, sorti en 1966. Ce film de guerre comique raconte l'histoire de deux Français ordinaires, Augustin Bouvet (Bourvil), un peintre en bâtiment, et Stanislaus Lefort (Louis de Funès), un chef d'orchestre, qui aident des aviateurs britanniques abattus au-dessus de la France occupée à rejoindre la zone libre. Leur périple les mène à travers divers lieux emblématiques de Paris et de la campagne française, avec des situations cocasses et des quiproquos hilarants. Le film est célèbre pour ses répliques cultes, ses scènes mémorables (comme la scène du restaurant ou celle de l'hôtel) et la dynamique exceptionnelle entre Bourvil et Louis de Funès. Avec plus de 17 millions d'entrées en France, La Grande Vadrouille reste le film le plus vu de l'histoire du cinéma français."
  image: "/static/images/films/la_grande_vadrouille.jpeg"
  image_alt: "Affiche du film La Grande Vadrouille avec Bourvil et Louis de Funès"
  annee: 1966
  realisateur: "Gérard Oury"
  acteurs: "Bourvil, Louis de Funès, Terry-Thomas, Claudio Brook"
  niveaux: 2

- id: le-capitan
  nom: "Le Capitan"
  titre: "Quiz Le Capitan : testez vos connaissances sur le film de cape et d'épée"
  description: "Plongez dans l'univers des films de cape et d'épée avec notre quiz sur Le Capitan. Découvrez si vous connaissez tous les détails de cette aventure palpitante adaptée des romans d'Alexandre Dumas."
  synopsis: "Le Capitan est un film français réalisé par André Hunebelle, sorti en 1960. Adapté du roman éponyme d'Alexandre Dumas, ce film de cape et d'épée met en scène Jean Marais dans le rôle du Capitan, un noble gascon qui se bat pour la justice sous le règne d'Henri III. Le film raconte les aventures du Capitan et de son fidèle ami, le comte de Bussy (interprété par Jean Marais également dans certains rôles), qui tentent de déjouer les complots de la cour et de protéger la France. Avec des décors somptueux, des costumes élégants et des scènes de duel impressionnantes, Le Capitan est un hommage aux grands films d'aventure à la française."
  image: "/static/images/films/le_capitan.jpeg"
  image_alt: "Affiche du film Le Capitan"
  annee: 1960
  realisateur: "André Hunebelle"
  acteurs: "Jean Marais, Bourvil, Elsa Martinelli"
  niveaux: 2

- id: le-prenom
  nom: "Le Prénom"
  titre: "Quiz Le Prénom : testez vos connaissances sur cette comédie familiale culte"
  description: "Découvrez notre quiz sur Le Prénom, la comédie française qui a conquis le public. Testez vos connaissances sur ce film hilarant qui explore les tensions familiales avec humour et finesse."
  synopsis: "Le Prénom est une comédie française réalisée par Alexandre de La Patellière et Matthieu Delaporte, sortie en 2012. Le film raconte l'histoire d'une famille bourgeoise qui se réunit pour un dîner. La soirée prend un tournant inattendu lorsque Vincent (François Xaviers), le frère aîné, annonce qu'il souhaite appeler son futur enfant Adolf. Cette révélation provoque des réactions variées et des débats houleux au sein de la famille, révélant des tensions, des préjugés et des secrets bien gardés. Avec un casting exceptionnel incluant Patrick Bruel, Valérie Benguigui, Charles Berling, Judith El Zein et Guillaume de Tonquedec, Le Prénom explore avec humour et intelligence les dynamiques familiales, les non-dits et les contradictions de la société contemporaine. Le film a connu un immense succès en France et à l'international, devenant l'un des films français les plus populaires des années 2010."
  image: "/static/images/films/le_prenomjpeg.jpeg"
  image_alt: "Affiche du film Le Prénom"
  annee: 2012
  realisateur: "Alexandre de La Patellière, Matthieu Delaporte"
  acteurs: "Patrick Bruel, Valérie Benguigui, Charles Berling, Judith El Zein, Guillaume de Tonquedec"
  niveaux: 3

- id: bienvenue-chez-les-ch-tis
  nom: "Bienvenue chez les ch'tis"
  titre: "Quiz Bienvenue chez les Ch'tis : testez vos connaissances sur le phénomène cinématographique"
  description: "Testez vos connaissances sur le film qui a marqué l'histoire du cinéma français. Découvrez si vous maîtrisez tous les détails de cette comédie culte de Dany Boon, qui a battu tous les records au box-office."
  synopsis: "Bienvenue chez les Ch'tis est une comédie française écrite, réalisée et interprétée par Dany Boon, sortie en 2008. Le film raconte l'histoire de Philippe Abrams (Kad Merad), un postier du Sud de la France, qui est muté dans le Nord, à Bergues, en punition d'une prétendue fraude. Initialement réticent et méprisant envers les habitants du Nord, qu'il considère comme des 'Ch'tis' arriérés, Philippe découvre peu à peu la chaleur humaine, la générosité et la convivialité de cette région. Le film met en lumière les stéréotypes entre le Nord et le Sud de la France et montre comment les préjugés peuvent être surmontés grâce à la rencontre et à l'amitié. Avec des répliques cultes, des personnages attachants et une touche d'humour typiquement ch'ti, Bienvenue chez les Ch'tis est devenu un phénomène de société en France, dépassant les 20 millions d'entrées au box-office et restant pendant des années le film le plus vu de l'histoire du cinéma français."
  image: "/static/images/films/bienvenue_chez_les_chtijpeg.jpeg"
  image_alt: "Affiche du film Bienvenue chez les Ch'tis"
  annee: 2008
  realisateur: "Dany Boon"
  acteurs: "Kad Merad, Dany Boon, Zoé Félix, Lorenzo Ausilia-Fratini"
  niveaux: 2
