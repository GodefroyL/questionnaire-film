<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ site.title }} - {{ page.title }}</title>
            <link rel="icon" href="{{ site.url }}/static/images/logo.ico">

        <link rel="stylesheet" href="{{ site.url }}/static/css/base.css">
        {% if page.css %}
        <link rel="stylesheet" href="{{ site.url }}/static/css/{{ page.css }}">
        {% endif %}
        {% if page.layout == "niveau" %}
        <link rel="stylesheet" href="{{ site.url }}/static/css/niveau.css">
        {% endif %}
    </head>
    <body>
        <header>
            <a href="{{ site.url }}/index.html">DGL - film</a>
        </header>
        <div class="titre">
            {{ page.title }}
        </div>
        <div class="contenu">
            {{ content }}
        </div>
    </body>
</html>
